name: Build CSP Short

on:
  workflow_dispatch:
    inputs:
      short_file:
        description: "Ścieżka do pliku YAML"
        required: true
        default: "shorts/001-drzwi-0.yaml"
      skip_images:
        description: "Pomiń generowanie obrazów (użyj istniejących)"
        required: false
        type: boolean
        default: false
      skip_tts:
        description: "Pomiń generowanie lektora (użyj istniejącego voice.wav)"
        required: false
        type: boolean
        default: false
      skip_preflight:
        description: "Pomiń pełny preflight (tylko awaryjnie)"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: [self-hosted, windows, x64, csp]
    timeout-minutes: 120
    env:
      CSP_OUTPUT_DIR: "C:\\CSP\\output"
      CSP_COMFY_URL: "http://127.0.0.1:8188"
      CSP_VOICE_REFERENCE: "C:\\CSP\\voice\\narrator_reference.wav"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve persistent Python
        shell: powershell
        run: |
          $candidate = $env:CSP_PYTHON
          if (-not $candidate -or -not (Test-Path $candidate)) {
            $candidate = 'C:\CSP\venv\Scripts\python.exe'
          }
          if (-not (Test-Path $candidate)) {
            throw 'Brak C:\CSP\venv. Uruchom najpierw setup/windows-bootstrap.ps1.'
          }
          "PYTHON_BIN=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $candidate --version

      - name: Ensure local ComfyUI is running
        if: ${{ !inputs.skip_images || !inputs.skip_preflight }}
        shell: powershell
        run: 'powershell -ExecutionPolicy Bypass -File setup/ensure-comfyui.ps1'

      - name: Preflight hardware and local services
        if: ${{ !inputs.skip_preflight }}
        shell: powershell
        run: '& $env:PYTHON_BIN scripts/preflight.py'

      - name: Validate short
        shell: powershell
        run: '& $env:PYTHON_BIN scripts/validate_short.py "${{ inputs.short_file }}"'

      - name: Generate 8 images
        if: ${{ !inputs.skip_images }}
        shell: powershell
        run: '& $env:PYTHON_BIN scripts/generate_images.py "${{ inputs.short_file }}"'

      - name: Generate Polish narration
        if: ${{ !inputs.skip_tts }}
        shell: powershell
        run: '& $env:PYTHON_BIN scripts/generate_tts.py "${{ inputs.short_file }}"'

      - name: Create word-timed subtitles
        shell: powershell
        run: '& $env:PYTHON_BIN scripts/transcribe.py "${{ inputs.short_file }}"'

      - name: Create ambience and twist impact
        shell: powershell
        run: '& $env:PYTHON_BIN scripts/sound_design.py "${{ inputs.short_file }}"'

      - name: Render final 1080x1920 MP4
        shell: powershell
        run: '& $env:PYTHON_BIN scripts/render.py "${{ inputs.short_file }}"'

      - name: Show output
        if: ${{ always() }}
        shell: powershell
        run: |
          Write-Host "CSP output root: $env:CSP_OUTPUT_DIR"
          if (Test-Path $env:CSP_OUTPUT_DIR) {
            Get-ChildItem $env:CSP_OUTPUT_DIR -Recurse -Filter final.mp4 |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 3 FullName, Length, LastWriteTime |
              Format-Table -AutoSize
          }
