name: CSP Studio CI

on:
  push:
    branches:
      - "feature/csp-*"
      - csp-automation-v1
  pull_request:
  workflow_dispatch:

concurrency:
  group: csp-studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight Studio dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML==6.0.2 fastapi==0.116.1 uvicorn==0.35.0 python-multipart==0.0.20 httpx==0.28.1 Pillow requests
      - name: Compile Python
        run: python -m compileall -q csp_studio scripts tests
      - name: Run CSP Studio unit regressions
        env:
          CSP_OUTPUT_DIR: ${{ runner.temp }}/csp-output
        run: |
          python -m unittest \
            tests.test_csp_actions \
            tests.test_csp_quick_cancel \
            tests.test_csp_comfy_control \
            tests.test_csp_pipeline_state \
            tests.test_csp_task_engine \
            tests.test_csp_task_runner \
            tests.test_csp_studio_web \
            tests.test_csp_studio_scene_ops \
            tests.test_csp_agent_one \
            tests.test_csp_visual_qa \
            tests.test_csp_visual_qa_placeholders \
            tests.test_csp_agent_memory \
            tests.test_csp_studio_worker \
            tests.test_csp_worker_execution_plane \
            tests.test_csp_ops_worker_routing \
            tests.test_csp_production_run \
            tests.test_csp_new_short_wizard \
            tests.test_csp_wizard_v2 \
            tests.test_csp_wizard_json_extract \
            tests.test_csp_nvidia_nim_provider \
            tests.test_csp_local_env \
            tests.test_csp_visual_bible \
            tests.test_csp_visual_bible_generation \
            tests.test_csp_flow_api \
            tests.test_csp_generate_scene -v

  frontend-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check zero-build frontend JavaScript
        run: |
          node --check csp_studio/web/app.js
          node --check csp_studio/web/actions.js
          node --check csp_studio/web/flow.js
          node --check csp_studio/web/flow_v2.js

  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse setup scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem setup -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax failed: $($_.Name)" }
          }
