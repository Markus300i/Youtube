name: CSP Static Checks

on:
  push:
    branches:
      - csp-automation-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight validation dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Static checks
        run: python scripts/static_check.py
