narration: >-
  W piwnicy starego bloku pojawiły się drzwi, których dzień wcześniej tam nie było.
  Były wciśnięte między rurę gazową a betonową ścianę i miały małą metalową tabliczkę z numerem zero.
  Administrator sprawdził plany budynku. Za tą ścianą powinien znajdować się tylko zasypany kanał techniczny.
  Wieczorem jeden z lokatorów usłyszał zza drzwi trzy spokojne puknięcia.
  Nie otworzył. Następnego ranka tabliczka z zerem leżała na podłodze, a na drzwiach ktoś wydrapał numer jego mieszkania.
  Administrator wezwał ślusarza. Gdy zamek puścił, za drzwiami nie było pomieszczenia, tylko wąski korytarz oświetlony jedną żarówką.
  Na jego końcu stały identyczne drzwi jak te do mieszkania lokatora.
  Najgorsze było to, że kiedy wrócili na parter, prawdziwe drzwi jego mieszkania miały już metalową tabliczkę z numerem zero.

