    prompt: "Opis osobnego natywnego kadru 9:16 dla sceny 7, wizualna wskazówka przed twistem"
    motion: "static"
  - id: 8
    text: "Fragment narracji sceny ósmej zawiera twist wynikający z informacji zasianych wcześniej."
    prompt: "Opis osobnego natywnego kadru 9:16 dla sceny 8 — najmocniejszy wizualny clue twistu"
    motion: "slow_push"

subtitles:
  max_words: 5
  uppercase: true

